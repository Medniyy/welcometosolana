<style>
/* ===== Gate — V3 design alignment =====
   Overrides v2.css tokens for gate.html only. All other pages unaffected. */

:root {
  /* V3 background / surface */
  --bg:               #0d0f12;
  --surface:          #161a20;
  --surface-raised:   #1b2029;
  /* V3 borders */
  --outline:          rgba(255,255,255,.07);
  --outline-muted:    rgba(255,255,255,.05);
  /* V3 ink scale */
  --on-surface:       #ecedef;
  --on-surface-variant: #b6bbc4;
  --on-surface-dim:   #5f646d;
  /* V3 fonts */
  --font-body:        'Inter', system-ui, -apple-system, sans-serif;
  --font-mono:        'JetBrains Mono', ui-monospace, monospace;
  /* V3 frost */
  --frost-1:          #cfeef6;
  --frost-2:          #93d2e8;
  --frost-3:          #6fb9d6;
  --frost-glow:       rgba(147,210,232,.20);
}

/* Dot grid — V3 tone (slightly cooler, softer) */
.dot-grid {
  background-image: radial-gradient(circle, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size: 28px 28px;
}

/* Ambient glows — primary (top-right frost) + secondary (bottom-left warm violet) */
.gate-body::before,
.gate-body::after {
  content: '';
  position: fixed;
  pointer-events: none;
  z-index: 0;
  filter: blur(90px);
}
.gate-body::before {
  top: -120px; right: -120px;
  width: 640px; height: 640px;
  background: radial-gradient(circle, rgba(147,210,232,.16), transparent 70%);
}
.gate-body::after {
  bottom: -160px; left: -140px;
  width: 580px; height: 580px;
  background: radial-gradient(circle, rgba(178,150,220,.08), transparent 70%);
  filter: blur(110px);
}

/* Title — V3 weight/tracking */
.gate-title {
  font-weight: 600;
  letter-spacing: -0.035em;
  color: var(--on-surface);
}

/* Subtitle — V3 frost italic gradient, with slow shimmer */
.gate-sub {
  font-weight: 300;
  font-size: clamp(1.25rem, 2.9vw, 2.1rem);
  letter-spacing: -0.01em;
  background: linear-gradient(
    90deg,
    #93d2e8 0%,
    #cfeef6 25%,
    #ffffff 50%,
    #cfeef6 75%,
    #93d2e8 100%
  );
  background-size: 220% 100%;
  background-position: 0% 0%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-top: 1rem;
}
@media (prefers-reduced-motion: no-preference) {
  .gate-sub { animation: gate-sub-shimmer 8s linear infinite; }
}
@keyframes gate-sub-shimmer {
  0%   { background-position: 0% 0%; }
  100% { background-position: -220% 0%; }
}

/* ===== Cards — bigger, with persona color tints ===== */
.card-fan { gap: 0; }
.arch-card {
  width: 210px;
  height: 340px;
  background: var(--surface);
  border-color: rgba(255,255,255,.10);
  border-radius: 20px;
  transition:
    transform .42s cubic-bezier(.22,.61,.36,1),
    border-color .35s,
    box-shadow .45s ease;
}
.arch-card + .arch-card { margin-left: -28px; }
/* Persona tint — a soft inner radial wash, blue glow ring on hover.
   --tint-rgb is set per card; consumed by the inner wash + hover glow. */
.arch-card[data-persona="new-to-solana"] { --tint-rgb: 147,210,232; }   /* frost blue */
.arch-card[data-persona="creator"]       { --tint-rgb: 196,160,232; }   /* soft violet */
.arch-card[data-persona="builder"]       { --tint-rgb: 232,196,120; }   /* warm amber */
.arch-card[data-persona="pro"]           { --tint-rgb: 130,222,180; }   /* cool green */

.arch-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(
    ellipse at 50% 110%,
    rgba(var(--tint-rgb), .14) 0%,
    rgba(var(--tint-rgb), .04) 35%,
    transparent 65%
  );
  pointer-events: none;
  opacity: .9;
  transition: opacity .35s ease;
  z-index: 0;
}
.arch-card > * { position: relative; z-index: 1; }

@media (prefers-reduced-motion: no-preference) {
  .arch-card:hover {
    border-color: rgba(var(--tint-rgb), .45);
    box-shadow:
      0 22px 60px rgba(0,0,0,.6),
      0 0 0 1px rgba(var(--tint-rgb), .22),
      0 0 80px -16px rgba(var(--tint-rgb), .42);
  }
  .arch-card:hover::before { opacity: 1.35; }
  .arch-card:hover .arch-media img {
    transform: scale(1.07) translateY(-6px);
  }
  .arch-card:active {
    transform: rotate(var(--r)) translateY(-10px) scale(1.015);
    transition: transform .08s ease;
  }
}

/* Card label — V3 mono style */
.arch-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .14em;
  color: var(--on-surface-variant);
  padding: .8rem .5rem 1.05rem;
  transition: color .3s ease, letter-spacing .3s ease;
}
.arch-card:hover .arch-label {
  color: rgb(var(--tint-rgb));
  letter-spacing: .18em;
}

/* Overlay — V3 background */
#gate-overlay { background: var(--bg); }

.overlay-text {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .12em;
  color: var(--on-surface-dim);
  transition: opacity .26s ease, transform .26s ease;
}
.overlay-text.is-leaving { opacity: 0; transform: translateY(-4px); }
.overlay-text.is-entering { opacity: 0; transform: translateY(4px); }

/* ===== Bottom CTA — glass buttons ===== */
.gate-cta {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .875rem;
  position: relative;
  z-index: 1;
}
.gate-cta-text {
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  color: var(--on-surface-dim);
  letter-spacing: .02em;
  text-align: center;
}
.gate-cta-btns {
  display: flex;
  gap: .625rem;
  flex-wrap: wrap;
  justify-content: center;
}
/* Override .placeholder-back styling, but ONLY when used inside the gate CTA. */
.gate-cta-btns .placeholder-back {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .14em;
  color: var(--on-surface-variant);
  background: rgba(255,255,255,.035);
  border: 1px solid rgba(255,255,255,.10);
  backdrop-filter: blur(14px) saturate(1.1);
  -webkit-backdrop-filter: blur(14px) saturate(1.1);
  padding: .75rem 1.1rem;
  border-radius: 999px;
  margin-top: 0;
  transition: border-color .25s ease, background .25s ease, color .25s ease, transform .15s ease, box-shadow .25s ease;
}
.gate-cta-btns .placeholder-back:hover {
  border-color: rgba(147,210,232,.32);
  background: rgba(147,210,232,.07);
  color: var(--on-surface);
  box-shadow: 0 8px 28px -12px rgba(147,210,232,.4);
}
.gate-cta-btns .placeholder-back:active {
  transform: scale(.97);
  transition: transform .08s ease;
}

/* Universal focus rings + button press feedback on the gate */
.arch-card:focus-visible,
.gate-cta-btns .placeholder-back:focus-visible {
  outline: 2px solid var(--frost-2);
  outline-offset: 4px;
  border-radius: 20px;
}
.arch-card { -webkit-tap-highlight-color: transparent; }

/* ===== Mobile — whole gate fits on one screen ===== */
@media (max-width: 600px) {
  .gate-body {
    gap: clamp(1rem, 3svh, 1.75rem);
    padding: max(1.25rem, env(safe-area-inset-top)) 1rem calc(1rem + env(safe-area-inset-bottom));
  }
  .gate-title { font-size: clamp(2.2rem, 11vw, 2.9rem); }
  .gate-sub { font-size: 1.1rem; margin-top: .6rem; }
  .card-fan { gap: .625rem; width: 100%; max-width: 380px; }
  .arch-card {
    width: 100%;
    height: clamp(148px, 23svh, 220px);
    border-radius: 16px;
  }
  .arch-card + .arch-card { margin-left: 0; }
  .arch-label { font-size: 10px; padding: .5rem .4rem .75rem; }
  .gate-cta { gap: .7rem; }
  .gate-cta-text { font-size: 12px; }
  .gate-cta-btns { gap: .5rem; }
  .gate-cta-btns .placeholder-back { padding: .6rem .95rem; font-size: 10px; letter-spacing: .12em; }
}
</style>
</head>
<body class="gate-body">

<div class="dot-grid" aria-hidden="true"></div>

<header class="gate-header">
  <h1 class="gate-title">Welcome to<br/>Solana</h1>
  <p class="gate-sub">Who are you here as?</p>
</header>

<main>
  <div class="card-fan" id="card-fan">

    <button class="arch-card" data-href="new-to-solana.html" data-persona="new-to-solana"
      data-img="Newtosolana.png"
      data-video="animatednewtosolana-alpha.webm"
      data-texts='["Mapping your route…","Collecting your first steps…","Almost ready…"]'
      aria-label="New to Solana">

      aria-label="Creator">

        <img src="Creators%20%26%20Media_%E2%80%A8.png" alt="" aria-hidden="true"/>
      </div>
      <span class="arch-label">Creator</span>
    </button>

    <button class="arch-card" data-href="builder.html" data-persona="builder"
      data-img="Builders_%E2%80%A8.png"
      data-texts='["Loading your stack…","Finding your tools…","Almost ready…"]'
      aria-label="Builder">

    </button>

      data-img="Pro%20and%20degens%20_.png"
      data-texts='["Assembling the deep stack…","Mapping your routes…","Almost ready…"]'
      aria-label="Pro">
      <div class="arch-media">

<footer class="gate-cta">
  <p class="gate-cta-text">Just want to browse everything?</p>
  <div class="gate-cta-btns">
    <a href="ecosystem-new.html" class="placeholder-back">Explore the ecosystem →</a>
    <a href="https://t.me/+3prPanTSreIwMzMy" target="_blank" rel="noopener" class="placeholder-back" onclick="window._track('click_telegram',{from:'gate'})">Join Telegram ↗</a>
    <a href="pitch.html" class="placeholder-back" onclick="window._track('click_pitch',{from:'gate'})">Why we built this →</a>
  </div>
</footer>

<div id="gate-overlay" role="status" aria-live="polite">
  <div class="overlay-char">
    <img id="overlay-char-img" src="" alt=""/>
    <video id="overlay-char-video" autoplay loop muted playsinline style="display:none;width:100%;height:100%;object-fit:contain"></video>
  </div>
  <p class="overlay-text" id="overlay-text"></p>
  <div class="overlay-dots" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>
</div>

<script>
(function(){
  var overlay   = document.getElementById('gate-overlay');
  var oImg      = document.getElementById('overlay-char-img');
  var oVideo    = document.getElementById('overlay-char-video');
  var oText     = document.getElementById('overlay-text');
  var fan       = document.getElementById('card-fan');
  var busy      = false;

  var isMobile = window.matchMedia('(max-width: 768px)').matches || ('ontouchstart' in window && screen.width < 1024);
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function pickCard(card){
    if(busy) return;
    busy = true;

    var href    = card.dataset.href;
    var persona = card.dataset.persona;
    localStorage.setItem('wts_persona', persona);
    window._track('gate_path_select', { persona: persona });

    /* When reduce-motion is on, skip the overlay entirely — no JS animation
       sequence means no flicker caused by CSS killing transitions mid-sequence. */
    if(reducedMotion){
      window.location.href = href;
      return;
    }

    var img     = card.dataset.img;
    var video   = card.dataset.video;
    var texts   = JSON.parse(card.dataset.texts || '["Getting ready…"]');

    var rect = card.getBoundingClientRect();
    var cx   = rect.left + rect.width  / 2;
    var cy   = rect.top  + rect.height / 2;

    if(video && !isMobile){
      oVideo.src = video;
      oVideo.style.display = 'block';
      oImg.style.display = 'none';
      oVideo.play().catch(function(){
        /* video play blocked (e.g. iOS policy) — fall back to static image */
        oVideo.style.display = 'none';
        oImg.src = img;
        oImg.style.display = 'block';
      });
    } else {
      oImg.src = img;
      oImg.style.display = 'block';
      oVideo.style.display = 'none';
    }
    oText.textContent = texts[0];

    [].forEach.call(fan.querySelectorAll('.arch-card'), function(c){
      if(c !== card) c.classList.add('fading-out');
    });

    overlay.style.setProperty('--cx', cx + 'px');
    overlay.style.setProperty('--cy', cy + 'px');
    overlay.classList.add('is-active');

    var i = 0;
    var seq = setInterval(function(){
      i = (i + 1) % texts.length;
      oText.classList.add('is-leaving');
      setTimeout(function(){
        oText.textContent = texts[i];
        oText.classList.remove('is-leaving');
        oText.classList.add('is-entering');
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            oText.classList.remove('is-entering');
          });
        });
      }, 260);
    }, 1100);

    setTimeout(function(){
      clearInterval(seq);
      window.location.href = href;
    }, 3400);
  }

  [].forEach.call(document.querySelectorAll('.arch-card'), function(card){
    card.addEventListener('click', function(){ pickCard(card); });
    card.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pickCard(card); }
    });
  });
})();
</script>
</body>
