<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cosmos engine harness — Welcome to Solana</title>
<meta name="description" content="Isolated harness for the Cosmos to Solana engine."/>
<!-- Not a user-facing page. The Cosmos route ships inside the unified bridge
     on the homepage; this exists so the engine can be worked on without the
     rest of that page in the way. -->
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" type="image/svg+xml" href="../../site/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"/>
<!-- Linked, not imported: bundling these would freeze a copy of the site's
     styles into the build and mean rebuilding the engine every time the
     homepage changed. -->
<link rel="stylesheet" href="../../site/assets/home.css"/>
<link rel="stylesheet" href="../../site/assets/bridge.css"/>
<style>
  .harness { max-width: 720px; padding: 56px 0 120px; }
  .harness-head { margin-bottom: 30px; }
  .harness-head h1 {
    margin: 0; font-family: var(--serif); font-weight: 400;
    font-size: clamp(2.4rem, 5vw, 3.4rem); line-height: 1; letter-spacing: -.04em;
  }
  .harness-head p { margin: 12px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <a class="wordmark" href="/" aria-label="Welcome to Solana home">Welcome to Solana</a>
  <a class="header-action" href="/#migrate">The real bridge</a>
</header>

<main id="main">
<div class="harness">
  <div class="harness-head">
    <p class="eyebrow">Harness · Cosmos engine</p>
    <h1>Cosmos to <em>Solana.</em></h1>
    <p>The Cosmos leg on its own, mounted exactly as the homepage mounts it.
      For development — the route users take is
      <a href="/#migrate">the unified bridge</a>.</p>
  </div>

  <div class="bridge-stage">
    <div class="bridge-panel" id="bridge-panel-cosmos"></div>
  </div>
</div>
</main>

<script type="module">
  import { mount } from "./entry.js";
  mount(document.getElementById("bridge-panel-cosmos"), {});
</script>
</body>
</html>
