<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pitch — welcometosolana.xyz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --frost-grad: linear-gradient(155deg, #bfe8f2, #93d2e8, #7bc4df);
      --text-primary: #bfe8f2;
      --text-dim:     #5a8aaa;
    }

    html, body {
      min-height: 100%;
      background: #141414;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Geist', 'Segoe UI', sans-serif;
      padding: 32px 16px;
    }

    /* ── WMP Window ── */
    .wmp {
      width: 100%;
      max-width: 820px;
      border-radius: 8px 8px 4px 4px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px #1e4a6a,
        0 0 40px rgba(123,196,223,0.12),
        0 24px 80px rgba(0,0,0,0.7);
      user-select: none;
    }

    /* ── Title bar ── */
    .wmp-titlebar {
      background: linear-gradient(180deg, #1a4060 0%, #0d2535 40%, #091d2e 100%);
      border-bottom: 1px solid #2a5a80;
      height: 28px;
      display: flex;
      align-items: center;
      padding: 0 6px;
      gap: 6px;
    }
    .wmp-logo { width: 18px; height: 18px; flex-shrink: 0; }
    .wmp-logo svg { width: 100%; height: 100%; }
    .wmp-title-text {
      flex: 1;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .wmp-winbtns { display: flex; gap: 2px; }
    .wmp-winbtn {
      width: 22px; height: 18px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 3px;
      background: linear-gradient(180deg, #1a4a6a 0%, #0d3048 100%);
      color: var(--text-primary);
      font-size: 9px;
      cursor: default;
      display: flex; align-items: center; justify-content: center;
    }
    .wmp-winbtn:hover { background: linear-gradient(180deg, #2a6a90 0%, #1a4060 100%); }
    .wmp-winbtn.close { background: linear-gradient(180deg, #8a1a1a 0%, #5a0d0d 100%); border-color: rgba(255,80,80,0.3); }
    .wmp-winbtn.close:hover { background: linear-gradient(180deg, #c02020 0%, #8a1010 100%); }

    /* ── Menu bar ── */
    .wmp-menubar {
      background: linear-gradient(180deg, #112540 0%, #0c1e33 100%);
      border-bottom: 1px solid #1a3a55;
      height: 24px;
      display: flex;
      align-items: center;
      padding: 0 8px;
    }
    .wmp-menu-item {
      font-size: 11.5px;
      color: var(--text-primary);
      padding: 0 10px;
      height: 100%;
      display: flex; align-items: center;
      cursor: default;
      border-radius: 2px;
    }
    .wmp-menu-item:hover { background: #1a3a55; }

    /* ── Toolbar strip ── */
    .wmp-toolbar {
      background: linear-gradient(180deg, #0e2236 0%, #091c2e 100%);
      border-bottom: 1px solid #163248;
      height: 22px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 4px;
    }
    .wmp-toolbar-btn {
      width: 20px; height: 16px;
      background: linear-gradient(180deg, #1a3a55 0%, #112233 100%);
      border: 1px solid #1e4060;
      border-radius: 2px;
      cursor: default;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-dim);
      font-size: 8px;
    }
    .wmp-toolbar-btn:hover { background: linear-gradient(180deg, #2a5070 0%, #1a3a55 100%); color: var(--text-primary); }
    .wmp-toolbar-sep { width: 1px; height: 14px; background: #163248; margin: 0 4px; }

    /* ── Video screen ── */
    .wmp-screen {
      background: #000;
      position: relative;
      aspect-ratio: 16/9;
      overflow: hidden;
      cursor: pointer;
    }
    .wmp-screen video {
      width: 100%; height: 100%;
      display: block;
      object-fit: contain;
    }

    /* Overlay — always covers screen, always clickable */
    .wmp-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Dark tint + play icon when paused */
    .wmp-overlay-bg {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.35);
      transition: opacity 0.2s;
    }
    .wmp-overlay.playing .wmp-overlay-bg { opacity: 0; }

    .wmp-big-play {
      position: relative;
      width: 72px; height: 72px;
      border-radius: 50%;
      background: linear-gradient(155deg, rgba(191,232,242,0.15), rgba(123,196,223,0.08));
      border: 1.5px solid rgba(123,196,223,0.5);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, opacity 0.2s;
    }
    .wmp-overlay.playing .wmp-big-play { opacity: 0; pointer-events: none; }
    .wmp-overlay:not(.playing):hover .wmp-big-play {
      background: linear-gradient(155deg, rgba(191,232,242,0.25), rgba(123,196,223,0.15));
      transform: scale(1.08);
    }
    .wmp-big-play svg { width: 28px; height: 28px; fill: #bfe8f2; margin-left: 4px; }

    /* Tap-to-pause flash indicator */
    .wmp-tap-flash {
      position: absolute;
      pointer-events: none;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
    }
    .wmp-tap-flash .flash-ring {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(7,21,37,0.55);
      border: 1.5px solid rgba(123,196,223,0.4);
      display: flex; align-items: center; justify-content: center;
    }
    .wmp-tap-flash svg { width: 22px; height: 22px; fill: #bfe8f2; }
    @keyframes tapflash {
      0%   { opacity: 0; transform: scale(0.85); }
      15%  { opacity: 1; transform: scale(1); }
      70%  { opacity: 1; }
      100% { opacity: 0; }
    }
    .wmp-tap-flash.active { animation: tapflash 0.55s ease-out forwards; }

    /* ── Divider ── */
    .wmp-divider {
      height: 4px;
      background: linear-gradient(180deg, #071525 0%, #091d2e 100%);
      border-top: 1px solid #0d2a40;
      border-bottom: 1px solid #1a3a55;
    }

    /* ── Seek row ── */
    .wmp-seekrow {
      background: linear-gradient(180deg, #091d2e 0%, #071525 100%);
      padding: 6px 10px 5px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #0d2535;
    }
    .wmp-time-label {
      font-size: 10px;
      color: var(--text-dim);
      min-width: 36px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
    }
    .wmp-time-label.right { text-align: right; }

    .wmp-seekbar {
      flex: 1;
      height: 20px;
      position: relative;
      cursor: pointer;
      display: flex; align-items: center;
    }
    .wmp-seekbar-track {
      position: absolute;
      left: 0; right: 0;
      height: 4px;
      background: #1a3a55;
      border-radius: 2px;
      overflow: visible;
    }
    .wmp-seekbar-fill {
      height: 100%;
      width: 0%;
      background: var(--frost-grad);
      border-radius: 2px;
      position: relative;
    }
    .wmp-seekbar-thumb {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #bfe8f2;
      box-shadow: 0 0 6px rgba(147,210,232,0.6);
      pointer-events: none;
    }

    /* ── Controls panel ── */
    .wmp-controls {
      background: linear-gradient(180deg, #091a2a 0%, #060f1a 100%);
      border-top: 1px solid #1a3a55;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      width: 34px; height: 28px;
      border-radius: 4px;
      border: 1px solid #1e4a6a;
      background: linear-gradient(180deg, #112840 0%, #091d2e 100%);
      color: var(--text-primary);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s;
      flex-shrink: 0;
    }
    .ctrl-btn:hover { background: linear-gradient(180deg, #1e4a70 0%, #112840 100%); border-color: #3a7aa0; }
    .ctrl-btn:active { background: linear-gradient(180deg, #0d3550 0%, #091520 100%); }
    .ctrl-btn svg { width: 12px; height: 12px; fill: currentColor; }

    .ctrl-btn.play-btn {
      width: 38px; height: 32px;
      border-radius: 50%;
      background: linear-gradient(155deg, #1a4a6a, #0d2e48);
      border-color: #2a6a90;
    }
    .ctrl-btn.play-btn:hover { background: linear-gradient(155deg, #2a6a90, #1a4060); border-color: #4a9ac0; }
    .ctrl-btn.play-btn svg { width: 14px; height: 14px; margin-left: 2px; }
    .ctrl-btn.play-btn.is-playing svg { margin-left: 0; }

    /* Fullscreen btn — larger & highlighted so it's easy to find on mobile */
    .ctrl-btn.fs-btn {
      margin-left: auto;
      width: 38px; height: 32px;
      background: linear-gradient(155deg, #1a3a55, #0d2535);
      border-color: #2a5a7a;
    }
    .ctrl-btn.fs-btn:hover { background: linear-gradient(155deg, #2a5a7a, #1a3a55); border-color: #3a7aa0; }

    .ctrl-sep { width: 1px; height: 20px; background: #163248; margin: 0 2px; }

    /* Volume */
    .wmp-vol { display: flex; align-items: center; gap: 6px; }
    .vol-slider-wrap {
      position: relative;
      width: 64px; height: 20px;
      cursor: pointer;
      display: flex; align-items: center;
    }
    .vol-track {
      position: absolute;
      left: 0; right: 0;
      height: 4px;
      background: #1a3a55;
      border-radius: 2px;
    }
    .vol-fill {
      height: 100%;
      width: 80%;
      background: var(--frost-grad);
      border-radius: 2px;
      position: relative;
    }
    .vol-thumb {
      position: absolute;
      right: -5px; top: 50%;
      transform: translateY(-50%);
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #7bc4df;
      box-shadow: 0 0 4px rgba(123,196,223,0.5);
    }

    /* Status bar */
    .wmp-status {
      background: linear-gradient(180deg, #060f1a 0%, #040c16 100%);
      border-top: 1px solid #0d2535;
      padding: 3px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .wmp-status-text { font-size: 10px; color: var(--text-dim); flex: 1; }
    .wmp-status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #1e4a6a;
      flex-shrink: 0;
    }
    .wmp-status-dot.ready   { background: #7bc4df; box-shadow: 0 0 4px rgba(123,196,223,0.5); }
    .wmp-status-dot.playing { background: #7bc4df; box-shadow: 0 0 6px rgba(123,196,223,0.7); animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

    /* ═══════════════════════════
       MOBILE  (≤ 600px)
       Tuned for iPhone 15 Pro Max (430×932)
    ═══════════════════════════ */
    @media (max-width: 600px) {
      html, body {
        height: 100svh;
        overflow: hidden;
        padding: 0;
        align-items: center;
        justify-content: center;
      }
      .wmp {
        border-radius: 0;
        box-shadow: none;
        width: 100%;
      }

      /* Hide desktop chrome */
      .wmp-menubar, .wmp-toolbar, .wmp-status { display: none; }

      /* Compact title bar */
      .wmp-titlebar { height: 36px; }
      .wmp-title-text { font-size: 13px; }
      .wmp-winbtn { width: 28px; height: 22px; font-size: 10px; }

      /* Video: full width, proper 16:9 — no stretching */
      .wmp-screen { aspect-ratio: 16/9; width: 100%; }

      /* Bigger seek area */
      .wmp-seekrow { padding: 10px 12px 8px; gap: 10px; }
      .wmp-time-label { font-size: 11px; min-width: 38px; }
      .wmp-seekbar { height: 28px; }
      .wmp-seekbar-track { height: 5px; }
      .wmp-seekbar-thumb { width: 18px; height: 18px; right: -9px; box-shadow: 0 0 10px rgba(147,210,232,0.7); }

      /* 44px+ touch targets */
      .wmp-controls { padding: 10px 12px 14px; gap: 8px; }
      .ctrl-btn { width: 44px; height: 40px; border-radius: 6px; }
      .ctrl-btn svg { width: 16px; height: 16px; }
      .ctrl-btn.play-btn { width: 52px; height: 46px; border-radius: 50%; }
      .ctrl-btn.play-btn svg { width: 18px; height: 18px; }
      .ctrl-btn.fs-btn { width: 52px; height: 46px; border-radius: 8px; }
      .ctrl-btn.fs-btn svg { width: 18px; height: 18px; }
      .vol-slider-wrap { width: 56px; height: 28px; }
      .vol-thumb { width: 14px; height: 14px; right: -7px; }
      .ctrl-sep { display: none; }
    }
  </style>
</head>
<body>

<div class="wmp" id="wmpWindow">

  <!-- Title bar -->
  <div class="wmp-titlebar">
    <div class="wmp-logo">
      <svg viewBox="0 0 18 18" fill="none">
        <circle cx="9" cy="9" r="8.5" fill="url(#lg)" stroke="#2a6a90" stroke-width="0.5"/>
        <polygon points="7,5.5 13.5,9 7,12.5" fill="#bfe8f2"/>
        <defs>
          <radialGradient id="lg" cx="35%" cy="30%">
            <stop offset="0%" stop-color="#2a7aaa"/>
            <stop offset="100%" stop-color="#0d2a42"/>
          </radialGradient>
        </defs>
      </svg>
    </div>
    <span class="wmp-title-text">welcometosolana.xyz — Pitch</span>
    <div class="wmp-winbtns">
      <button class="wmp-winbtn">&#8211;</button>
      <button class="wmp-winbtn">&#9633;</button>
      <button class="wmp-winbtn close">&#10005;</button>
    </div>
  </div>

  <!-- Menu bar (desktop only) -->
  <div class="wmp-menubar">
    <span class="wmp-menu-item">File</span>
    <span class="wmp-menu-item">View</span>
    <span class="wmp-menu-item">Play</span>
    <span class="wmp-menu-item">Tools</span>
    <span class="wmp-menu-item">Help</span>
  </div>

  <!-- Toolbar (desktop only) -->
  <div class="wmp-toolbar">
    <button class="wmp-toolbar-btn">&#9664;</button>
    <button class="wmp-toolbar-btn">&#9654;</button>
    <div class="wmp-toolbar-sep"></div>
    <button class="wmp-toolbar-btn">&#9632;</button>
    <button class="wmp-toolbar-btn">&#8635;</button>
    <div class="wmp-toolbar-sep"></div>
    <button class="wmp-toolbar-btn">&#8962;</button>
  </div>

  <!-- Video screen -->
  <div class="wmp-screen" id="screen">
    <video id="pitchVideo" preload="auto" playsinline>
      <source src="assets/pitch-web.mp4" type="video/mp4">
    </video>

    <!-- Overlay: always present, always clickable -->
    <div class="wmp-overlay" id="overlay">
      <div class="wmp-overlay-bg"></div>

      <!-- Big play/pause circle -->
      <div class="wmp-big-play" id="bigPlay">
        <svg id="bigPlayIcon" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
      </div>

      <!-- Flash indicator for tap-to-pause -->
      <div class="wmp-tap-flash" id="tapFlash">
        <div class="flash-ring">
          <svg id="flashIcon" viewBox="0 0 24 24">
            <rect x="5" y="3" width="4" height="18" rx="1"/>
            <rect x="15" y="3" width="4" height="18" rx="1"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div class="wmp-divider"></div>

  <!-- Seek row -->
  <div class="wmp-seekrow">
    <span class="wmp-time-label" id="currentTime">0:00</span>
    <div class="wmp-seekbar" id="seekbar">
      <div class="wmp-seekbar-track">
        <div class="wmp-seekbar-fill" id="seekFill">
          <div class="wmp-seekbar-thumb"></div>
        </div>
      </div>
    </div>
    <span class="wmp-time-label right" id="totalTime">0:00</span>
  </div>

  <!-- Controls -->
  <div class="wmp-controls">

    <button class="ctrl-btn play-btn" id="playBtn">
      <svg id="playIcon" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
    </button>

    <button class="ctrl-btn" id="stopBtn">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/></svg>
    </button>

    <div class="ctrl-sep"></div>

    <button class="ctrl-btn" id="rewindBtn">
      <svg viewBox="0 0 24 24"><polygon points="11,5 2,12 11,19"/><polygon points="21,5 12,12 21,19"/></svg>
    </button>

    <button class="ctrl-btn" id="ffBtn">
      <svg viewBox="0 0 24 24"><polygon points="3,5 12,12 3,19"/><polygon points="13,5 22,12 13,19"/></svg>
    </button>

    <div class="ctrl-sep"></div>

    <button class="ctrl-btn" id="muteBtn">
      <svg id="volIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="currentColor" stroke="none"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    </button>

    <div class="wmp-vol">
      <div class="vol-slider-wrap" id="volSlider">
        <div class="vol-track">
          <div class="vol-fill" id="volFill">
            <div class="vol-thumb"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Fullscreen — pushed to far right -->
    <button class="ctrl-btn fs-btn" id="fsBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <polyline points="15,3 21,3 21,9"/>
        <polyline points="9,21 3,21 3,15"/>
        <line x1="21" y1="3" x2="14" y2="10"/>
        <line x1="3" y1="21" x2="10" y2="14"/>
      </svg>
    </button>

  </div>

  <!-- Status bar (desktop only) -->
  <div class="wmp-status">
    <div class="wmp-status-dot" id="statusDot"></div>
    <span class="wmp-status-text" id="statusText">Ready</span>
  </div>

</div>

<script>
  const video       = document.getElementById('pitchVideo');
  const overlay     = document.getElementById('overlay');
  const bigPlayIcon = document.getElementById('bigPlayIcon');
  const tapFlash    = document.getElementById('tapFlash');
  const flashIcon   = document.getElementById('flashIcon');
  const playBtn     = document.getElementById('playBtn');
  const playIcon    = document.getElementById('playIcon');
  const stopBtn     = document.getElementById('stopBtn');
  const rewindBtn   = document.getElementById('rewindBtn');
  const ffBtn       = document.getElementById('ffBtn');
  const muteBtn     = document.getElementById('muteBtn');
  const volIcon     = document.getElementById('volIcon');
  const seekbar     = document.getElementById('seekbar');
  const seekFill    = document.getElementById('seekFill');
  const volSlider   = document.getElementById('volSlider');
  const volFill     = document.getElementById('volFill');
  const curTimeEl   = document.getElementById('currentTime');
  const totTimeEl   = document.getElementById('totalTime');
  const statusDot   = document.getElementById('statusDot');
  const statusText  = document.getElementById('statusText');
  const fsBtn       = document.getElementById('fsBtn');

  const PLAY_SVG  = `<polygon points="5,3 19,12 5,21"/>`;
  const PAUSE_SVG = `<rect x="5" y="3" width="4" height="18" rx="1"/><rect x="15" y="3" width="4" height="18" rx="1"/>`;
  const VOL_ON    = `<polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="currentColor" stroke="none"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>`;
  const VOL_OFF   = `<polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="currentColor" stroke="none"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>`;

  function fmt(s) {
    if (!s || isNaN(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  function setStatus(state) {
    statusDot.className = 'wmp-status-dot ' + (state === 'playing' ? 'playing' : state === 'ready' || state === 'paused' ? 'ready' : '');
    statusText.textContent = { playing: 'Playing', paused: 'Paused', ready: 'Ready', ended: 'Playback complete' }[state] || 'Ready';
  }

  function flashIndicator(isPause) {
    flashIcon.innerHTML = isPause
      ? `<rect x="5" y="3" width="4" height="18" rx="1"/><rect x="15" y="3" width="4" height="18" rx="1"/>`
      : `<polygon points="5,3 19,12 5,21"/>`;
    tapFlash.classList.remove('active');
    void tapFlash.offsetWidth; // reflow to restart animation
    tapFlash.classList.add('active');
  }

  video.addEventListener('loadedmetadata', () => {
    totTimeEl.textContent = fmt(video.duration);
    setStatus('ready');
  });

  video.addEventListener('timeupdate', () => {
    const pct = video.duration ? (video.currentTime / video.duration) * 100 : 0;
    seekFill.style.width = pct + '%';
    curTimeEl.textContent = fmt(video.currentTime);
  });

  video.addEventListener('ended', () => {
    overlay.classList.remove('playing');
    playIcon.innerHTML = PLAY_SVG;
    bigPlayIcon.innerHTML = PLAY_SVG;
    playBtn.classList.remove('is-playing');
    setStatus('ended');
  });

  // ── Play / Pause ──
  function togglePlay(fromOverlay) {
    if (video.paused || video.ended) {
      video.play();
      overlay.classList.add('playing');
      playIcon.innerHTML = PAUSE_SVG;
      bigPlayIcon.innerHTML = PAUSE_SVG;
      playBtn.classList.add('is-playing');
      setStatus('playing');
      if (fromOverlay) flashIndicator(false); // briefly show play triangle
    } else {
      video.pause();
      overlay.classList.remove('playing');
      playIcon.innerHTML = PLAY_SVG;
      bigPlayIcon.innerHTML = PLAY_SVG;
      playBtn.classList.remove('is-playing');
      setStatus('paused');
      if (fromOverlay) flashIndicator(true); // briefly show pause bars
    }
  }

  // Clicking the overlay (screen) toggles play/pause
  overlay.addEventListener('click', () => togglePlay(true));
  playBtn.addEventListener('click', () => togglePlay(false));

  // Stop
  stopBtn.addEventListener('click', () => {
    video.pause();
    video.currentTime = 0;
    overlay.classList.remove('playing');
    playIcon.innerHTML = PLAY_SVG;
    bigPlayIcon.innerHTML = PLAY_SVG;
    playBtn.classList.remove('is-playing');
    setStatus('ready');
  });

  // Rewind / FF
  rewindBtn.addEventListener('click', () => { video.currentTime = Math.max(0, video.currentTime - 10); });
  ffBtn.addEventListener('click',     () => { video.currentTime = Math.min(video.duration, video.currentTime + 10); });

  // ── Seek ──
  function seek(clientX) {
    const rect = seekbar.getBoundingClientRect();
    const pct  = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    video.currentTime = pct * (video.duration || 0);
  }
  let seeking = false;
  seekbar.addEventListener('mousedown',  e => { seeking = true; seek(e.clientX); });
  document.addEventListener('mousemove', e => { if (seeking) seek(e.clientX); });
  document.addEventListener('mouseup',   () => { seeking = false; });
  seekbar.addEventListener('touchstart', e => { seek(e.touches[0].clientX); e.stopPropagation(); }, { passive: true });
  seekbar.addEventListener('touchmove',  e => { seek(e.touches[0].clientX); e.stopPropagation(); }, { passive: true });

  // ── Volume ──
  let currentVol = 0.8;
  video.volume = currentVol;
  volFill.style.width = (currentVol * 100) + '%';

  function setVol(clientX) {
    const rect = volSlider.getBoundingClientRect();
    currentVol = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    video.volume = currentVol;
    video.muted  = false;
    volFill.style.width = (currentVol * 100) + '%';
    volIcon.innerHTML = currentVol === 0 ? VOL_OFF : VOL_ON;
  }
  let volDragging = false;
  volSlider.addEventListener('mousedown',  e => { volDragging = true; setVol(e.clientX); });
  document.addEventListener('mousemove',   e => { if (volDragging) setVol(e.clientX); });
  document.addEventListener('mouseup',     () => { volDragging = false; });
  volSlider.addEventListener('touchstart', e => { setVol(e.touches[0].clientX); }, { passive: true });
  volSlider.addEventListener('touchmove',  e => { setVol(e.touches[0].clientX); }, { passive: true });

  muteBtn.addEventListener('click', () => {
    video.muted = !video.muted;
    volIcon.innerHTML = video.muted ? VOL_OFF : VOL_ON;
    volFill.style.width = video.muted ? '0%' : (currentVol * 100) + '%';
  });

  // ── Fullscreen — targets the video element for proper mobile landscape ──
  const FS_EXPAND = `<polyline points="15,3 21,3 21,9"/><polyline points="9,21 3,21 3,15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>`;
  const FS_SHRINK = `<polyline points="4,14 4,20 10,20"/><polyline points="20,10 20,4 14,4"/><line x1="4" y1="20" x2="11" y2="13"/><line x1="20" y1="4" x2="13" y2="11"/>`;

  async function toggleFullscreen() {
    try {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const target = video; // use video element so mobile gets proper native FS
        const reqFS = target.requestFullscreen || target.webkitRequestFullscreen || target.mozRequestFullScreen;
        await reqFS.call(target);
        // Lock to landscape on mobile
        if (screen.orientation && screen.orientation.lock) {
          try { await screen.orientation.lock('landscape'); } catch(e) {}
        }
        fsBtn.querySelector('svg').innerHTML = FS_SHRINK;
      } else {
        const exitFS = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen;
        await exitFS.call(document);
        if (screen.orientation && screen.orientation.unlock) {
          try { screen.orientation.unlock(); } catch(e) {}
        }
        fsBtn.querySelector('svg').innerHTML = FS_EXPAND;
      }
    } catch(e) {}
  }

  fsBtn.addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange',       () => { if (!document.fullscreenElement)       fsBtn.querySelector('svg').innerHTML = FS_EXPAND; });
  document.addEventListener('webkitfullscreenchange', () => { if (!document.webkitFullscreenElement) fsBtn.querySelector('svg').innerHTML = FS_EXPAND; });

  // ── Keyboard shortcuts ──
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space')      { e.preventDefault(); togglePlay(false); }
    if (e.code === 'ArrowLeft')  { e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 5); }
    if (e.code === 'ArrowRight') { e.preventDefault(); video.currentTime = Math.min(video.duration, video.currentTime + 5); }
    if (e.code === 'ArrowUp')    { e.preventDefault(); currentVol = Math.min(1, currentVol + 0.1); video.volume = currentVol; volFill.style.width = (currentVol*100)+'%'; }
    if (e.code === 'ArrowDown')  { e.preventDefault(); currentVol = Math.max(0, currentVol - 0.1); video.volume = currentVol; volFill.style.width = (currentVol*100)+'%'; }
    if (e.code === 'KeyM')       { muteBtn.click(); }
    if (e.code === 'KeyF')       { toggleFullscreen(); }
  });
</script>
</body>
</html>
